                "<p>The typical pattern of results is that people are faster to recognize words after related primes than after unrelated primes.</p>" +
                "<p>Your average correct response time was " + Math.round(rel_rt) +
                " milliseconds after related primes, and " + Math.round(unrel_rt) + " milliseconds after unrelated primes.</p>" +
                "<p>Does your data line up with the expected pattern?</p>" +
                "<p>**Press Enter for next page**.</p>";

            return message;
        }
    }
    timeline.push(debrief4);

    var debrief5 = {
        type: 'html-keyboard-response',
        choices: ['Enter'],
        stimulus: function () {
            var message = "<p>By subtracting reaction times for the word shown with a related prime from reaction times with an unrelated prime,</p>" +
                "<p>we can estimate how much your brain makes use of the related prime to</p>" +
                "<p>help recognize the target. Then we can compare those differences across conditions to see whether the brain is relying </p>" +
                "<p>on word structure more for words with consistent stems (TRUSTING) than words with inconsistent stems (WHISKING). </p>" +
                "<p>**Press Enter for next page**.</p>";

            return message;
        }
    }
    timeline.push(debrief5);

    var debrief6 = {
        type: 'html-keyboard-response',
        choices: ['Enter'],
        stimulus: function () {
            var message = "<p>Thank you for your participation. If you have any questions, please contact </p>" +
                "<p>the principal investigator, Patience Stevens, at pstevens@andrew.cmu.edu.</p>" +
                "<p>**Press Enter to save your data.**</p>" +
                "<p>**This will automatically alert the experimenter that you have completed the study.**.</p>";
            return message;
        }
    }
    timeline.push(debrief6);

    jsPsych.init({
        timeline: timeline,
        on_data_update: function (data) {
            // write data file to server data folder
            saveData(subjID + "_incomplete_data.csv", jsPsych.data.get().csv());
        },
        on_finish: function () {
            // write data file to server data folder
            var subnum = JSON.parse(jsPsych.data.get().filter({ block: 'subjnum' }).values()[0].responses).SonaID;
            finalSaveData("sub_" + subnum + "_complete_data.csv", jsPsych.data.get().csv());
        },
        default_iti: 0
    });
</script>
